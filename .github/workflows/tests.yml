name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install opencv-python-headless numpy requests python-dotenv pyyaml lap pytest
      - name: Correr pruebas
        run: pytest -q
